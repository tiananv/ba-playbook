name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --locked
      - run: uv run pytest
      - run: make results
      - run: git diff --exit-code -- README.md docs/SETUP.md results/checker-benchmark.json
